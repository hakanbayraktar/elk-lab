name: elk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    container_name: elk-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-DevOps2026!}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # kibana_system kullanicisina parola verir ve kapanir.
  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    container_name: elk-kibana-setup
    restart: "no"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-DevOps2026!}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:-DevOps2026!}
    command:
      - bash
      - -c
      - >-
        curl -sf -X POST -u "elastic:$${ELASTIC_PASSWORD}"
        http://elasticsearch:9200/_security/user/kibana_system/_password
        -H "Content-Type: application/json"
        -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"
        && echo "kibana_system parolasi ayarlandi"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.25
    container_name: elk-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-DevOps2026!}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=elk-lab-saved-objects-key-32-chars-min
      - XPACK_SECURITY_ENCRYPTIONKEY=elk-lab-security-key-32-characters-min
      - XPACK_REPORTING_ENCRYPTIONKEY=elk-lab-reporting-key-32-characters-min
    ports:
      - "15601:5601"
    depends_on:
      kibana-setup:
        condition: service_completed_successfully

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.25
    container_name: elk-logstash
    environment:
      - LS_JAVA_OPTS=${LS_JAVA_OPTS:--Xms512m -Xmx512m}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-DevOps2026!}
      - CONFIG_RELOAD_AUTOMATIC=true
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ./pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:

networks:
  default:
    name: elk-net
