# Filebeat her olaya fields.log_source ekler (system, docker, k8s).
# Index adi bu alandan uretilir: system-logs-2026.11.19 gibi.
output {
  if [fields][log_source] {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      user     => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index    => "%{[fields][log_source]}-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      user     => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index    => "other-logs-%{+YYYY.MM.dd}"
    }
  }
}
