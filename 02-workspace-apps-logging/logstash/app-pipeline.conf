input {
  file {
    path => "/logs/nginx/access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "nginx_access"
  }
  file {
    path => "/logs/apps/api.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "api_json"
  }
}

filter {
  if [type] == "nginx_access" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    mutate {
      convert => { "response" => "integer" }
      convert => { "bytes" => "integer" }
    }
  }

  if [type] == "api_json" {
    mutate {
      convert => { "http_status" => "integer" }
      add_field => { "[ecs][version]" => "8.0.0" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "apps-%{type}-%{+YYYY.MM.dd}"
  }
}
