filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/auth.log
    fields:
      log_type: system_auth
    fields_under_root: true

  - type: log
    enabled: true
    paths:
      - /var/log/syslog
    fields:
      log_type: system_syslog
    fields_under_root: true
    exclude_files: ['\.gz$']

processors:
  - add_host_metadata:
      when.not.has_fields: ['host']

output.logstash:
  hosts: ["localhost:5044"]

# İsteğe bağlı: Doğrudan Elasticsearch'e göndermek için:
# output.elasticsearch:
#   hosts: ["http://localhost:9200"]
#   index: "system-logs-%{+YYYY.MM.dd}"
