filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"

processors:
  - add_host_metadata: ~

output.elasticsearch:
  hosts: ["http://localhost:9200"]
  index: "docker-containers-%{+YYYY.MM.dd}"

# Alternatif: Logstash üzerinden iletim için:
# output.logstash:
#   hosts: ["localhost:5044"]
