filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"

processors:
  - add_host_metadata: ~

setup.ilm.enabled: false
setup.template.name: "docker-containers"
setup.template.pattern: "docker-containers-*"

output.elasticsearch:
  hosts: ["http://localhost:9200"]
  username: "elastic"
  password: "BilginIT454"
  index: "docker-containers-%{+YYYY.MM.dd}"

