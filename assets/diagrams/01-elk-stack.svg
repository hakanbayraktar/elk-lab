<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Elastic Stack lab mimarisi</title>
  <desc>Filebeat'ler sunucu, Docker ve kind cluster'dan log toplar, Logstash 5044 portundan alır, Elasticsearch 9200'de saklar, Kibana 15601'de gösterir.</desc>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#344054"/></marker>
    <style>
      .bg{fill:#f7fafc}
      .h1{font:700 40px Arial,sans-serif;fill:#1d2939}
      .sub{font:400 20px Arial,sans-serif;fill:#475467}
      .box{stroke-width:3;rx:16}
      .t{font:700 24px Arial,sans-serif;fill:#ffffff}
      .s{font:400 18px Arial,sans-serif;fill:#ffffff}
      .d{font:400 18px Arial,sans-serif;fill:#344054}
      .lbl{font:700 18px Arial,sans-serif;fill:#344054}
      .ln{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#ok)}
      .zone{fill:#ffffff;stroke:#98a2b3;stroke-width:2;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="h1" x="60" y="70">Elastic Stack: logun yolculuğu</text>
  <text class="sub" x="60" y="105">LAB-01 stack'i (elk-net ağı) bütün lablarda açık kalır; diğer lablar log kaynağı ekler.</text>

  <rect class="zone" x="40" y="140" width="430" height="700" rx="18"/>
  <text class="lbl" x="60" y="175">Log kaynakları</text>
  <rect class="box" x="70" y="200" width="370" height="130" fill="#6b5b95" stroke="#4b3f6b"/>
  <text class="t" x="90" y="240">Sunucu (LAB-02)</text>
  <text class="s" x="90" y="272">/var/log/auth.log</text>
  <text class="s" x="90" y="300">SSH, sudo kayıtları</text>
  <rect class="box" x="70" y="360" width="370" height="130" fill="#6b5b95" stroke="#4b3f6b"/>
  <text class="t" x="90" y="400">Docker (LAB-02/03)</text>
  <text class="s" x="90" y="432">co.elastic.logs/enabled=true</text>
  <text class="s" x="90" y="460">etiketli container'lar</text>
  <rect class="box" x="70" y="520" width="370" height="130" fill="#6b5b95" stroke="#4b3f6b"/>
  <text class="t" x="90" y="560">kind cluster (LAB-04)</text>
  <text class="s" x="90" y="592">Filebeat DaemonSet</text>
  <text class="s" x="90" y="620">/var/log/containers</text>
  <rect class="box" x="70" y="680" width="370" height="130" fill="#5aa454" stroke="#3d7a39"/>
  <text class="t" x="90" y="720">Demo veri (LAB-05)</text>
  <text class="s" x="90" y="752">generate_demo_data.py</text>
  <text class="s" x="90" y="780">doğrudan demo-* index'leri</text>

  <rect class="box" x="560" y="330" width="300" height="200" fill="#f5a700" stroke="#b37a00"/>
  <text class="t" x="585" y="375">Logstash</text>
  <text class="s" x="585" y="410">beats girdisi :5044</text>
  <text class="s" x="585" y="440">50-grok.conf (LAB-03)</text>
  <text class="s" x="585" y="470">index = log_source</text>
  <text class="s" x="585" y="500">-logs-YYYY.MM.dd</text>

  <rect class="box" x="960" y="330" width="300" height="200" fill="#005571" stroke="#003a4d"/>
  <text class="t" x="985" y="375">Elasticsearch</text>
  <text class="s" x="985" y="410">:9200, tek node</text>
  <text class="s" x="985" y="440">system-logs-*</text>
  <text class="s" x="985" y="470">docker-logs-*, k8s-logs-*</text>
  <text class="s" x="985" y="500">demo-*</text>

  <rect class="box" x="960" y="620" width="300" height="180" fill="#0b6e99" stroke="#074d6b"/>
  <text class="t" x="985" y="665">Kibana</text>
  <text class="s" x="985" y="700">:15601 (container 5601)</text>
  <text class="s" x="985" y="730">Discover, Lens, panolar</text>
  <text class="s" x="985" y="760">Security alert'leri</text>

  <rect class="box" x="1340" y="620" width="220" height="180" fill="#ffffff" stroke="#344054"/>
  <text class="lbl" x="1360" y="665">Tarayıcı</text>
  <text class="d" x="1360" y="700">&lt;sunucu&gt;-kibana</text>
  <text class="d" x="1360" y="728">.devopsatolyesi.com</text>
  <text class="d" x="1360" y="760">veya IP:15601</text>

  <rect class="box" x="1340" y="330" width="220" height="200" fill="#ffffff" stroke="#344054"/>
  <text class="lbl" x="1360" y="375">curl / Dev Tools</text>
  <text class="d" x="1360" y="410">elastic /</text>
  <text class="d" x="1360" y="438">DevOps2026!</text>

  <path class="ln" d="M440,265 C500,265 500,400 556,400"/>
  <path class="ln" d="M440,425 L556,425"/>
  <path class="ln" d="M440,585 C500,585 500,455 556,455"/>
  <path class="ln" d="M440,745 C700,745 760,520 956,500"/>
  <path class="ln" d="M860,430 L956,430"/>
  <text class="lbl" x="868" y="418">bulk</text>
  <path class="ln" d="M1110,616 L1110,534"/>
  <text class="d" x="1120" y="585">kibana_system</text>
  <path class="ln" d="M1336,710 L1264,710"/>
  <path class="ln" d="M1336,430 L1264,430"/>
  <text class="d" x="560" y="285">Filebeat → elk-logstash:5044</text>
  <text class="d" x="560" y="312">(kind'dan: ağ gateway'i:5044)</text>
</svg>
