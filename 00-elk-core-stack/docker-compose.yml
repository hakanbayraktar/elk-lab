services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-BilginIT454}
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -u ${ELASTIC_USERNAME:-elastic}:${ELASTIC_PASSWORD:-BilginIT454} http://localhost:9200/_cat/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - elk-net

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: kibana-setup
    restart: "no"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-BilginIT454}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:-BilginIT454}
    command: >
      bash -c '
        echo "Waiting for Elasticsearch to become healthy..."
        until curl -s -f -u "elastic:$${ELASTIC_PASSWORD}" http://elasticsearch:9200/_cat/health > /dev/null 2>&1; do
          sleep 2
        done
        echo "Configuring kibana_system password..."
        curl -s -f -X POST -u "elastic:$${ELASTIC_PASSWORD}" \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"
        echo "kibana_system password configured successfully."
      '
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: logstash
    environment:
      - "LS_JAVA_OPTS=${LS_JAVA_OPTS:--Xms512m -Xmx512m}"
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTIC_USERNAME:-elastic}
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-BilginIT454}
    volumes:
      - ./pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"   # Beats input
      - "5000:5000"   # TCP/JSON input
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-BilginIT454}
      - SERVER_NAME=kibana
    ports:
      - "${KIBANA_PORT:-15601}:5601"
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully
    networks:
      - elk-net

networks:
  elk-net:
    driver: bridge
