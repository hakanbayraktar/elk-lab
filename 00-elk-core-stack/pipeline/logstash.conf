input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Standart zaman damgası ve etiketleme
  mutate {
    add_field => { "[@metadata][target_index]" => "logstash-%{+YYYY.MM.dd}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
  }
  # Hata ayıklama çıktısı (isteğe bağlı)
  # stdout { codec => rubydebug }
}
