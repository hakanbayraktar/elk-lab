input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Otomatik İndeks Yönlendirme Mantığı
  if [log_type] == "auth" or [event][action] == "ssh_login" {
    mutate {
      add_field => { "[@metadata][target_index]" => "system-logs-%{+YYYY.MM.dd}" }
    }
  } else if [log_type] == "web" or [type] == "nginx_access" or [type] == "api_json" {
    mutate {
      add_field => { "[@metadata][target_index]" => "app-logs-%{+YYYY.MM.dd}" }
    }
  } else if [service] == "sample-application" or [tags] and "sample_logs" in [tags] {
    mutate {
      add_field => { "[@metadata][target_index]" => "app-logs-%{+YYYY.MM.dd}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][target_index]" => "logstash-%{+YYYY.MM.dd}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTICSEARCH_USERNAME:elastic}"
    password => "${ELASTICSEARCH_PASSWORD:BilginIT454}"
    index => "%{[@metadata][target_index]}"
  }
}
