filter {
  # Nginx erisim satiri -> source.address, http.*, url.original, user_agent.original
  if [container][name] == "demo-nginx" and [stream] == "stdout" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      remove_field => [ "timestamp" ]
    }
  }

  # auth.log satiri -> zaman, process ve asil mesaj
  if [fields][log_source] == "system" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:[log][time]} %{SYSLOGHOST:[log][host]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: %{GREEDYDATA:[log][text]}" }
    }
    # @timestamp = satirin yazildigi an (okundugu an degil)
    date {
      match => [ "[log][time]", "ISO8601" ]
    }
    # SSH girisleri -> user.name, source.ip, event.outcome
    if [process][name] == "sshd" {
      grok {
        match => { "[log][text]" => [
          "^Failed password for (invalid user )?%{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER}",
          "^Invalid user %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER}",
          "^Accepted %{WORD} for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER}"
        ] }
        tag_on_failure => []
      }
      if [log][text] =~ /^(Failed password|Invalid user)/ {
        mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "failure" } }
      } else if [log][text] =~ /^Accepted/ {
        mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "success" } }
      }
    }
  }
}
